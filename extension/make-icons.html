<!DOCTYPE html>
<html>
<body>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<script>
function drawIcon(canvas) {
  var s = canvas.width;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#57068c';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.18);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = s * 0.1;
  ctx.lineCap = 'round';
  // Three lines
  [[0.2,0.35,0.8,0.35],[0.2,0.5,0.65,0.5],[0.2,0.65,0.72,0.65]].forEach(function(l) {
    ctx.beginPath(); ctx.moveTo(l[0]*s,l[1]*s); ctx.lineTo(l[2]*s,l[3]*s); ctx.stroke();
  });
}
['c16','c48'].forEach(function(id) {
  var c = document.getElementById(id);
  drawIcon(c);
  var a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = 'icon' + c.width + '.png';
  a.textContent = 'Download icon' + c.width + '.png';
  a.style.display = 'block';
  document.body.appendChild(a);
});
</script>
</body>
</html>
