<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYU Albert Course Organizer</title>
  <style>
    :root {
      --purple: #57068c;
      --purple-light: #8900e1;
      --gray-100: #f8f9fa;
      --gray-200: #e9ecef;
      --gray-400: #adb5bd;
      --gray-600: #6c757d;
      --gray-800: #343a40;
      --white: #ffffff;
      --radius: 10px;
      --shadow: 0 2px 10px rgba(87,6,140,0.09);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-100);
      color: var(--gray-800);
      min-height: 100vh;
    }

    header {
      background: var(--purple);
      color: var(--white);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header p  { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }

    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }

    /* ── Input card ── */
    .input-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 24px;
    }
    .input-card h2 { font-size: 0.95rem; font-weight: 600; color: var(--purple); margin-bottom: 6px; }
    .how-to { font-size: 0.8rem; color: var(--gray-600); line-height: 1.6; margin-bottom: 10px; }
    .how-to ol { padding-left: 16px; margin-top: 3px; }

    textarea {
      width: 100%;
      height: 180px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.8rem;
      font-family: 'SFMono-Regular', Consolas, monospace;
      resize: vertical;
      color: var(--gray-800);
      transition: border-color 0.2s;
    }
    textarea:focus { outline: none; border-color: var(--purple-light); }

    .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      padding: 8px 18px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    .btn-primary   { background: var(--purple); color: var(--white); }
    .btn-primary:hover { opacity: 0.87; }
    .btn-secondary { background: var(--gray-200); color: var(--gray-800); }
    .btn-secondary:hover { background: #ced4da; }

    /* ── Summary bar ── */
    .summary {
      font-size: 0.8rem;
      color: var(--gray-600);
      margin-bottom: 18px;
      padding: 8px 14px;
      background: var(--white);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .summary strong { color: var(--purple); }

    /* ── Day sections ── */
    .day-section { margin-bottom: 26px; }
    .day-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .day-pill {
      background: var(--purple);
      color: var(--white);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .day-rule { flex: 1; height: 1px; background: var(--gray-200); }

    /* ── Class cards ── */
    .cards { display: flex; flex-direction: column; gap: 8px; }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 0 14px;
      align-items: center;
      border-left: 4px solid var(--purple);
    }
    .card.recitation { border-left-color: #0062cc; }
    .card.lab        { border-left-color: #28a745; }
    .card.seminar    { border-left-color: #fd7e14; }

    .card-time { text-align: right; }
    .time-start { font-size: 0.95rem; font-weight: 700; color: var(--gray-800); display: block; }
    .time-end   { font-size: 0.72rem; color: var(--gray-600); display: block; margin-top: 1px; }

    .card-main { min-width: 0; }
    .card-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 3px;
    }
    .course-code {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--purple);
    }
    .card.recitation .course-code { color: #0062cc; }
    .card.lab        .course-code { color: #28a745; }
    .card.seminar    .course-code { color: #fd7e14; }

    .section-num {
      font-size: 0.72rem;
      color: var(--gray-600);
      font-weight: 600;
    }
    .comp-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .comp-lecture    { background: #f3e8ff; color: #57068c; }
    .comp-recitation { background: #dbeafe; color: #1d4ed8; }
    .comp-lab        { background: #dcfce7; color: #166534; }
    .comp-seminar    { background: #ffedd5; color: #9a3412; }
    .comp-other      { background: var(--gray-200); color: var(--gray-600); }

    .card-meta {
      font-size: 0.75rem;
      color: var(--gray-600);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 2px;
    }
    .card-meta span { display: flex; align-items: center; gap: 3px; }
    .days-tag { font-weight: 600; color: var(--gray-800); }

    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

    .status-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }
    .status-open     { background: #dcfce7; color: #15803d; }
    .status-waitlist { background: #fef9c3; color: #854d0e; }
    .status-closed   { background: #fee2e2; color: #b91c1c; }

    .class-num {
      font-size: 0.68rem;
      color: var(--gray-400);
      font-family: monospace;
    }

    /* ── Error / empty ── */
    .message {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      color: var(--gray-600);
      box-shadow: var(--shadow);
      font-size: 0.88rem;
    }
    .message.error {
      border-left: 4px solid #dc3545;
      color: #dc3545;
      text-align: left;
    }

    #output { display: none; }

    @media (max-width: 560px) {
      .card { grid-template-columns: 72px 1fr; }
      .card-right { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>NYU Albert Course Organizer</h1>
    <p>Paste course listings &mdash; get a clean list sorted by day &amp; time</p>
  </div>
</header>

<main>
  <div class="input-card">
    <h2>Paste Course Listings</h2>
    <div class="how-to">
      In NYU Albert, browse a course, then select all &amp; copy the entire page text and paste it below.
      Repeat for as many courses as you want &mdash; just keep appending.
    </div>
    <textarea id="rawInput" placeholder="Paste Albert course listing text here...

The app reads the format like:
  09/02/2026 - 12/14/2026  Mon,Wed  11.00 AM - 12.15 PM  at [room]  with [instructor]"></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="run()">Organize Courses</button>
      <button class="btn-secondary" onclick="loadDemo()">Load Demo</button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <div id="output"></div>
</main>

<script>
// ── Day helpers ──────────────────────────────────────────────────────────────
const DAY_ORDER = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAY_ABBR_MAP = {
  mon:'Monday', tue:'Tuesday', wed:'Wednesday', thu:'Thursday',
  fri:'Friday',  sat:'Saturday', sun:'Sunday',
  // Albert sometimes uses these too
  mo:'Monday', tu:'Tuesday', we:'Wednesday', th:'Thursday',
  fr:'Friday',  sa:'Saturday', su:'Sunday'
};

function expandDays(str) {
  // Input like "Mon,Wed" or "Mon" or "Tue,Thu"
  return str.split(/[,\s]+/)
    .map(d => DAY_ABBR_MAP[d.toLowerCase().slice(0,3)] || DAY_ABBR_MAP[d.toLowerCase().slice(0,2)] || null)
    .filter(Boolean);
}

// ── Time helpers ─────────────────────────────────────────────────────────────
function parseAlbertTime(str) {
  // Handles "11.00 AM", "2.00 PM", "12.15 PM"
  const m = str.trim().match(/^(\d{1,2})\.(\d{2})\s*(AM|PM)$/i);
  if (!m) return null;
  let h = parseInt(m[1]);
  const min = parseInt(m[2]);
  const ampm = m[3].toUpperCase();
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  return h * 60 + min;
}

function fmt12(mins) {
  if (mins == null) return '';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

// ── Parser ───────────────────────────────────────────────────────────────────
// Matches lines like:
// 09/02/2026 - 12/14/2026 Mon,Wed 11.00 AM - 12.15 PM at 44 W 4th St (Kaufman Mgt Ctr) Room 2-60 with Bowmaker, Simon
// 09/02/2026 - 12/14/2026 Mon 2.00 PM - 3.15 PM at 40 W 4th St (Tisch Hall) Room UC11
const SCHED_RE = /\d{2}\/\d{2}\/\d{4}\s*-\s*\d{2}\/\d{2}\/\d{4}\s+([\w,]+)\s+(\d{1,2}\.\d{2}\s*[AP]M)\s*-\s*(\d{1,2}\.\d{2}\s*[AP]M)\s+at\s+(.+?)(?:\s+with\s+(.+))?$/i;

function parse(raw) {
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const sections = [];

  let currentCourse = null;  // { code, name }
  let block = {};            // accumulates fields for the current section

  function flush() {
    if (block.schedLine) {
      const m = block.schedLine.match(SCHED_RE);
      if (m) {
        const days      = expandDays(m[1]);
        const startMin  = parseAlbertTime(m[2]);
        const endMin    = parseAlbertTime(m[3]);
        const location  = m[4].trim();
        const instructor = m[5] ? m[5].trim() : '';
        if (days.length && startMin != null) {
          sections.push({
            courseCode:  block.courseCode || (currentCourse && currentCourse.code) || '',
            section:     block.section    || '',
            classNum:    block.classNum   || '',
            component:   block.component  || '',
            status:      block.status     || '',
            days, startMin, endMin, location, instructor
          });
        }
      }
    }
    block = {};
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // Detect course code line like "ECON-UB 1" at the start of a new course
    if (/^[A-Z]{2,}-[A-Z]{2}\s+\d+/.test(line) && !line.startsWith('Class#')) {
      // Could be standalone "ECON-UB 1" repeat lines between sections — capture if it has no other data
      if (!block.courseCode) {
        block.courseCode = line.split(/\s+/).slice(0,2).join(' ');
      }
      continue;
    }

    // Course description header: detect pattern "[DEPT-SCHOOL CODE] | N units" in earlier line
    // Albert puts course code at the top before the description
    if (/^\s*[A-Z]{2,}-[A-Z]{2}\s+\d+\s*\|\s*\d+\s*units/.test(line)) {
      const codeMatch = line.match(/([A-Z]{2,}-[A-Z]{2}\s+\d+)/);
      if (codeMatch) {
        currentCourse = { code: codeMatch[1] };
        flush();
      }
      continue;
    }

    if (/^Class#:\s*(\d+)/.test(line)) {
      flush();
      block.classNum = line.match(/^Class#:\s*(\d+)/)[1];
      if (currentCourse) block.courseCode = currentCourse.code;
      continue;
    }
    if (/^Section:\s*(\S+)/.test(line)) {
      block.section = line.match(/^Section:\s*(\S+)/)[1];
      continue;
    }
    if (/^Class Status:\s*(.+)/.test(line)) {
      const s = line.match(/^Class Status:\s*(.+)/)[1].trim();
      block.status = s;
      continue;
    }
    if (/^Component:\s*(.+)/.test(line)) {
      block.component = line.match(/^Component:\s*(.+)/)[1].trim();
      continue;
    }

    // Schedule line
    if (SCHED_RE.test(line)) {
      block.schedLine = line;
      continue;
    }
  }
  flush();
  return sections;
}

// ── Render ───────────────────────────────────────────────────────────────────
function compClass(comp) {
  if (!comp) return 'other';
  const c = comp.toLowerCase();
  if (c.includes('lecture'))    return 'lecture';
  if (c.includes('recitation')) return 'recitation';
  if (c.includes('lab'))        return 'lab';
  if (c.includes('seminar'))    return 'seminar';
  return 'other';
}

function statusInfo(s) {
  if (!s) return { cls: 'status-open', label: 'Open' };
  const l = s.toLowerCase();
  if (l.includes('wait')) return { cls: 'status-waitlist', label: s };
  if (l.includes('closed') || l.includes('full')) return { cls: 'status-closed', label: 'Closed' };
  return { cls: 'status-open', label: 'Open' };
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shortLocation(loc) {
  // Shorten "44 W 4th St (Kaufman Mgt Ctr) Room 2-60" → "KMC Room 2-60"
  const roomMatch = loc.match(/Room\s+(\S+)/i);
  const parenMatch = loc.match(/\(([^)]+)\)/);
  if (parenMatch && roomMatch) {
    // Abbreviate building name to initials
    const abbr = parenMatch[1].split(/\s+/).map(w => w[0]).join('').toUpperCase();
    return `${abbr} Rm ${roomMatch[1]}`;
  }
  if (roomMatch) return `Rm ${roomMatch[1]}`;
  return loc.length > 30 ? loc.slice(0,28)+'…' : loc;
}

function render(sections) {
  if (!sections.length) {
    document.getElementById('output').innerHTML =
      '<div class="message error">No class sections found. Make sure the text includes schedule lines like:<br><code>09/02/2026 - 12/14/2026 Mon,Wed 11.00 AM - 12.15 PM at [room]</code></div>';
    document.getElementById('output').style.display = 'block';
    return;
  }

  // Group by day
  const byDay = {};
  for (const s of sections) {
    for (const day of s.days) {
      if (!byDay[day]) byDay[day] = [];
      byDay[day].push(s);
    }
  }

  const totalSections = sections.length;
  const open = sections.filter(s => !s.status.toLowerCase().includes('wait') && !s.status.toLowerCase().includes('closed')).length;
  const courses = new Set(sections.map(s => s.courseCode)).size;

  let html = `<div class="summary">
    <span><strong>${totalSections}</strong> sections across <strong>${courses}</strong> course${courses!==1?'s':''}</span>
    <span><strong style="color:#15803d">${open}</strong> open &nbsp;|&nbsp; <strong style="color:#854d0e">${sections.filter(s=>s.status.toLowerCase().includes('wait')).length}</strong> waitlist &nbsp;|&nbsp; <strong style="color:#b91c1c">${sections.filter(s=>s.status.toLowerCase().includes('closed')||s.status.toLowerCase().includes('full')).length}</strong> closed</span>
  </div>`;

  for (const day of DAY_ORDER) {
    if (!byDay[day]) continue;
    const sorted = byDay[day].sort((a,b) => a.startMin - b.startMin);

    html += `<div class="day-section">
      <div class="day-header">
        <span class="day-pill">${day}</span>
        <div class="day-rule"></div>
      </div>
      <div class="cards">`;

    for (const s of sorted) {
      const cc    = compClass(s.component);
      const si    = statusInfo(s.status);
      const allDays = s.days.map(d => d.slice(0,3)).join(', ');
      const multiDay = s.days.length > 1;

      html += `<div class="card ${cc}">
        <div class="card-time">
          <span class="time-start">${fmt12(s.startMin)}</span>
          <span class="time-end">to ${fmt12(s.endMin)}</span>
        </div>
        <div class="card-main">
          <div class="card-top">
            <span class="course-code">${esc(s.courseCode)}</span>
            <span class="section-num">§${esc(s.section)}</span>
            <span class="comp-badge comp-${cc}">${esc(s.component||'?')}</span>
          </div>
          <div class="card-meta">
            ${multiDay ? `<span class="days-tag">${esc(allDays)}</span>` : ''}
            ${s.location  ? `<span>&#128205; ${esc(shortLocation(s.location))}</span>` : ''}
            ${s.instructor? `<span>&#128100; ${esc(s.instructor)}</span>` : ''}
          </div>
        </div>
        <div class="card-right">
          <span class="status-badge ${si.cls}">${esc(si.label)}</span>
          ${s.classNum ? `<span class="class-num">#${esc(s.classNum)}</span>` : ''}
        </div>
      </div>`;
    }

    html += `</div></div>`;
  }

  const out = document.getElementById('output');
  out.innerHTML = html;
  out.style.display = 'block';
}

// ── Main ─────────────────────────────────────────────────────────────────────
function run() {
  const raw = document.getElementById('rawInput').value;
  if (!raw.trim()) {
    document.getElementById('output').innerHTML = '<div class="message">Paste course text above and click Organize.</div>';
    document.getElementById('output').style.display = 'block';
    return;
  }
  render(parse(raw));
}

function clearAll() {
  document.getElementById('rawInput').value = '';
  document.getElementById('output').style.display = 'none';
  document.getElementById('output').innerHTML = '';
}

function loadDemo() {
  document.getElementById('rawInput').value = `This course covers basic microeconomic principles including applications of supply and demand analysis; consumer choice; theory of the firm under perfect and imperfect competition; game theory and strategy; and theory and policy issues in market imperfections, such as monopoly and antitrust, externalities and regulation, imperfect information and regulation, and income distribution.

</script>
